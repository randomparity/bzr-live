PerlSwitches -w -T
ServerName localhost

# Bugzilla's mod_perl.pl caps each child at 45MB unshared (Apache2::SizeLimit);
# modern children exceed that immediately, so every child exits after a couple of
# requests. With keep-alive on, strict HTTP clients (bzr/hyper) then reuse
# connections into dying children and fail with "connection closed". A disposable
# fixture doesn't need persistent connections; one request per connection is
# deterministic.
KeepAlive Off

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    PerlConfigRequire /var/www/html/mod_perl.pl
</VirtualHost>
