name: Container lifecycle

on:
  pull_request:
    paths:
      - .github/workflows/container-lifecycle.yml
      - .env.example
      - .gitignore
      - Makefile
      - README.md
      - compose.yaml
      - containers/**
      - docs/adr/0005-cold-fixture-checkpoints.md
      - docs/workflow/specs/2026-08-29-complete-checkpoint-save-restore-design.md
      - scripts/lifecycle
      - scripts/checkpoint
      - src/bzr_live/checkpoint.py
      - tests/lifecycle_test.sh
      - tests/checkpoint_smoke.sh
      - tests/test_checkpoint.py
      - scenarios/**
      - tests/smoke_scenario.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/container-lifecycle.yml
      - .env.example
      - .gitignore
      - Makefile
      - README.md
      - compose.yaml
      - containers/**
      - docs/adr/0005-cold-fixture-checkpoints.md
      - docs/workflow/specs/2026-08-29-complete-checkpoint-save-restore-design.md
      - scripts/lifecycle
      - scripts/checkpoint
      - src/bzr_live/checkpoint.py
      - tests/lifecycle_test.sh
      - tests/checkpoint_smoke.sh
      - tests/test_checkpoint.py
      - scenarios/**
      - tests/smoke_scenario.sh

permissions:
  contents: read

jobs:
  x86_64-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.11"
          enable-cache: false
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"

      - name: Verify native architecture
        run: test "$(uname -m)" = x86_64

      - name: Run lifecycle contract checks
        run: |
          make test
          make check

      - name: Install the pinned bzr build
        # libdbus-1-dev is not preinstalled on GitHub's Ubuntu images; bzr's own CI
        # installs it in every job that compiles (randomparity/bzr
        # .github/workflows/ci.yml:21-22). cargo and rustup are preinstalled, but the
        # toolchain the image defaults to drifts, so 1.89.0 -- the channel the pinned
        # tree's own rust-toolchain.toml names -- is requested explicitly. The revision
        # is the one README.md states this scenario is proven at, pinned by full SHA
        # with --locked. The prefix is outside the workspace because compose.yaml builds
        # from context "." and this repository has no .dockerignore.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 install --git https://github.com/randomparity/bzr \
            --rev 63abb94e7e14a2db79efe0ddf0011a1f32ed8640 \
            --locked --root "$RUNNER_TEMP/bzr" bzr

      - name: Start the fixture
        run: make up

      - name: Exercise the live scenario smoke path
        # Provision, replay, verify, checkpoint save, mutate, restore, re-verify, resume
        # -- one invocation, because every stage after the replay reads the state root
        # that script mktemps. It removes that root on its success path only, so a
        # failed run leaves it for inspection (ADR 0010 decision 8).
        env:
          BZR_LIVE_BZR: ${{ runner.temp }}/bzr/bin/bzr
        run: make smoke

      - name: Exercise checkpoint round trip
        run: make checkpoint-smoke

      - name: Clean project resources
        if: always()
        run: CONFIRM_CLEAN=1 make clean
