name: Container lifecycle

on:
  pull_request:
    paths:
      - .github/workflows/container-lifecycle.yml
      - .env.example
      - .gitignore
      - Makefile
      - README.md
      - compose.yaml
      - containers/**
      - scripts/lifecycle
      - tests/lifecycle_test.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/container-lifecycle.yml
      - .env.example
      - .gitignore
      - Makefile
      - README.md
      - compose.yaml
      - containers/**
      - scripts/lifecycle
      - tests/lifecycle_test.sh

permissions:
  contents: read

jobs:
  x86_64-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = x86_64

      - name: Run lifecycle contract checks
        run: |
          make test
          make check

      - name: Exercise live lifecycle
        run: |
          make up
          make doctor
          make down
          make up
          CONFIRM_RESET=1 make reset

      - name: Clean project resources
        if: always()
        run: CONFIRM_CLEAN=1 make clean
